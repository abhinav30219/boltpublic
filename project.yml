name: Bolt
options:
  bundleIdPrefix: com.bolt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your own team here or in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: ""

packages:
  BoltCore:
    path: Packages/BoltCore
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    exactVersion: 0.18.1

targets:
  Bolt:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bolt
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        NSBluetoothAlwaysUsageDescription: Bolt connects to a standard Bluetooth heart-rate band to read your heart rate, and to your companion robot to send it moves. Nothing leaves your phone.
        NSMotionUsageDescription: Bolt uses motion to recognise activity (walking, running), count steps, and detect waves and falls, all on this iPhone.
        UIBackgroundModes: [bluetooth-central]
        NSSpeechRecognitionUsageDescription: Bolt turns your voice into text on this iPhone. Nothing is sent anywhere.
        NSMicrophoneUsageDescription: Bolt listens only while the mic is on, to talk with you. Nothing is sent anywhere.
    entitlements:
      path: App/Bolt.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bolt.companion
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: $(inherited)
    dependencies:
      - package: BoltCore
      - package: LiteRTLM
        product: LiteRTLM

schemes:
  Bolt:
    build:
      targets:
        Bolt: all
    run:
      config: Debug

